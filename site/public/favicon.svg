<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f4ff"/>
      <stop offset="100%" stop-color="#ece5ff"/>
    </linearGradient>
    <linearGradient id="nv" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#a38deb"/>
      <stop offset="100%" stop-color="#836bd8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9e87ea"/>
      <stop offset="100%" stop-color="#7c62d4"/>
    </linearGradient>
  </defs>
  <!-- Soft rounded badge so the icon stays legible on both light and dark browser tabs -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <!-- Iceberg peaks behind the narval -->
  <polygon fill="#d6c9fb" points="8,41 20,18 32,41"/>
  <polygon fill="#e2d8fd" points="16,41 30,8 53,41"/>
  <!-- Crisp white separation halo around the narval -->
  <path fill="none" stroke="#f5f1ff" stroke-width="4.6" d="M17,42 C19,24 31,19 42,23 C49,26 52,34 51,42"/>
  <!-- Narval head peeking over the waterline -->
  <path fill="url(#nv)" d="M17,43 C19,25 31,20 42,24 C49,27 51,35 50,43 Z"/>
  <!-- Pale lavender belly -->
  <path fill="#e6defd" d="M31,43 C34,34 45,32 50,38 L50,43 Z"/>
  <!-- Diagonal narval horn -->
  <path fill="#efe9fe" stroke="#ffffff" stroke-width=".6" d="M38,26 L53,11.5 C54.2,10.5 55.4,11.8 54.4,13.4 L44,30 C41.5,31.5 37,29 38,26 Z"/>
  <!-- Cute determined eyes & smile matching narval-logo.png -->
  <path fill="#382575" d="M31.5,31.4 L37.2,32.6 C37,34.4 35.6,35.3 34,35.1 C32.3,34.9 31.3,33.3 31.5,31.4 Z"/>
  <path fill="#382575" d="M47.8,30.2 L42.4,31.6 C42.8,33.4 44.3,34.2 45.9,33.8 C47.5,33.4 48.2,31.9 47.8,30.2 Z"/>
  <path fill="none" stroke="#382575" stroke-width="2.2" stroke-linecap="round" d="M38.2,34.3 Q40.3,37 42.4,34"/>
  <!-- White wave gap + ocean base -->
  <path fill="none" stroke="#f5f1ff" stroke-width="4.8" stroke-linecap="round" d="M5,44 Q16,37 29,43 T59,44"/>
  <path fill="url(#sea)" d="M5,44 Q16,38 29,43.5 T59,44 C52,45.5 48,51 43,57 L21,57 C16,51 12,45.5 5,44 Z"/>
  <path fill="#c4b4f7" opacity=".42" d="M37,45 L49,44 C46,49 44,53 41,57 L29,57 Z"/>
</svg>
