name: Release

# Builds the binaries for every platform, attaches them (with checksums.txt) to the release and
# publishes it. Release Please calls this after merging its release PR: the release it creates is
# a draft, so users (and the in-app updater) only see it once the binaries are there. Pushing a
# tag such as v0.3.0 by hand still works and creates the release from scratch.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to build, e.g. v0.3.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            name="studyhomie_${TAG}_${os}_${arch}"
            bin=studyhomie; [ "$os" = windows ] && bin=studyhomie.exe
            mkdir "dist/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG}" \
              -o "dist/$name/$bin" ./cmd/studyhomie
            cp README.md LICENSE "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -rf "dist/$name"
          done
          cd dist && sha256sum * > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi

  # ---- package managers: each one is skipped (with a warning) while its secret is not set ----

  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish studyhomie to npm
        working-directory: npm
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::warning::NPM_TOKEN is not set: npm was skipped"; exit 0; fi
          npm version "${TAG#v}" --no-git-tag-version
          npm publish --provenance --access public

  taps:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Render the Scoop manifest and the Homebrew formula
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p checksums.txt
          node packaging/render.mjs "$TAG" checksums.txt out
      - name: Push them to krilinxito/scoop-bucket and krilinxito/homebrew-tap
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "::warning::TAP_GITHUB_TOKEN is not set: Scoop and Homebrew were skipped"; exit 0; fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish() { # repo, file, path in the repo
            dir=$(mktemp -d)
            git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/$1.git" "$dir"
            mkdir -p "$dir/$(dirname "$3")"
            cp "$2" "$dir/$3"
            git -C "$dir" add "$3"
            if git -C "$dir" diff --cached --quiet; then echo "$1 already has $TAG"; return; fi
            git -C "$dir" commit -m "studyhomie ${TAG#v}"
            git -C "$dir" push
          }
          publish krilinxito/scoop-bucket out/scoop/studyhomie.json bucket/studyhomie.json
          publish krilinxito/homebrew-tap out/homebrew/studyhomie.rb Formula/studyhomie.rb

  choco:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      CHOCO_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Pack, install it here, and push to chocolatey.org
        run: |
          gh release download $env:TAG -R $env:GITHUB_REPOSITORY -p checksums.txt
          node packaging/render.mjs $env:TAG checksums.txt out
          Set-Location out/choco
          choco pack
          choco install studyhomie --source . --yes --no-progress
          studyhomie version
          if (-not $env:CHOCO_KEY) { Write-Output "::warning::CHOCOLATEY_API_KEY is not set: Chocolatey was skipped"; exit 0 }
          choco push "studyhomie.$($env:TAG.TrimStart('v')).nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCO_KEY
