name: Release Please

# On every push to main, Release Please keeps a "chore(main): release x.y.z" PR open with the
# next version (worked out from the conventional commits: feat → minor, fix → patch) and the
# CHANGELOG. Merging that PR tags the version and creates a draft release; the build job below
# then attaches the binaries and publishes it. Tags pushed with GITHUB_TOKEN do not start other
# workflows, which is why the build is called from here instead of relying on the tag push.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    secrets: inherit # NPM_TOKEN, TAP_GITHUB_TOKEN, CHOCOLATEY_API_KEY
    permissions:
      contents: write
      id-token: write

  # the website shows the latest version, so it is rebuilt once the release is out
  site:
    needs: build
    uses: ./.github/workflows/site.yml
    permissions:
      contents: read
      pages: write
      id-token: write
