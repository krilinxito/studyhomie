name: Site

# Builds the website in site/ (Astro) and publishes it on GitHub Pages, at studyhomie.maxi42.space.
# It runs when the site (or the narval it shares with the app) changes, by hand, and after each
# release (called from release-please.yml), so the page shows the latest version.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - internal/web/static/narval.*
      - docs/img/**
      - .github/workflows/site.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }} # reads the latest release without the anonymous rate limit
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
