<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .tip { fill: #4f46e5; }
    .facet { fill: #818cf8; }
    .wave { fill: none; stroke: #6366f1; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    .deep { fill: #6366f1; opacity: .28; }
    @media (prefers-color-scheme: dark) {
      .tip { fill: #a5b4fc; }
      .facet { fill: #e0e7ff; }
      .wave { stroke: #818cf8; }
      .deep { fill: #818cf8; opacity: .32; }
    }
  </style>
  <!-- the tip: what you see -->
  <path class="tip" d="M17 27 L25 15 L30 19 L37 7 L47 27 Z"/>
  <path class="facet" d="M37 7 L47 27 H39.5 Z"/>
  <!-- the waterline -->
  <path class="wave" d="M6 33 q4.5 -4 9 0 t9 0 t9 0 t9 0 t9 0 t7 0"/>
  <!-- and everything underneath -->
  <path class="deep" d="M13 38 H51 L58 47 L45 58 L22 60 L7 48 Z"/>
</svg>
